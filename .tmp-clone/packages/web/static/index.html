<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <title>AI Debate</title>
    <!--
      Stylesheet first, then the bundle. Both are same-origin paths.

      CSP note for the server: this page ships no inline script, so
      `script-src 'self'` is enough. Styles are different — the inherited card
      injects its own `<style>` element at startup and React sets `style`
      attributes on a few nodes, both of which fall under `style-src`. Serving
      with `style-src 'self'` alone would render the whole card unstyled, so the
      policy needs `style-src 'self' 'unsafe-inline'` (or a nonce the card cannot
      supply). See `packages/web/README.md` § 与服务端的契约.
    -->
    <link rel="stylesheet" href="/assets/theme.css" />
  </head>
  <body>
    <!--
      The whole document body is this one element. Everything else — the top
      bar, the auth card, the product page — is built by
      `/assets/app.js`. `#app-root` stays in the markup because the React mount
      point has to exist before the bundle runs; the shell inserts its own nodes
      around it rather than the other way round.
    -->
    <div id="shell">
      <div id="app-root"></div>
    </div>
    <noscript>
      <p style="padding: 20px; font: 13px/1.6 system-ui, sans-serif">
        此控制台需要 JavaScript 才能运行。请在浏览器中启用 JavaScript 后刷新页面。
      </p>
    </noscript>
    <script src="/assets/app.js" defer></script>
  </body>
</html>

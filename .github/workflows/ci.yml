name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22.18.0'

jobs:
  secrets-scan:
    name: Credential and privacy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Scan tracked files for credentials
        run: node scripts/scan-secrets.mjs

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        # Builds core first: the monitoring acceptance imports the compiled surface
        # (lib/) deliberately, the same way the migrated core tests do.
        run: npm run typecheck
      - name: Build core, web and server bundle
        run: npm run build && npm run bundle
      - name: Core tests
        shell: bash
        run: npm run test:core
      - name: Server tests
        shell: bash
        run: node --experimental-transform-types --test --test-concurrency=2 "packages/server/test/**/*.test.ts"
      - name: Web tests
        shell: bash
        run: node --test packages/web/test/*.test.mjs
      - name: End-to-end acceptance
        shell: bash
        run: node --experimental-transform-types test/acceptance/standalone.ts
      - name: Background monitoring acceptance
        shell: bash
        run: node --experimental-transform-types test/acceptance/automation.ts
      - name: Crash recovery acceptance
        shell: bash
        run: node --experimental-transform-types test/acceptance/recovery.ts
      - name: No DSH dependency
        shell: bash
        run: node scripts/assert-no-dsh.mjs

  package-windows:
    name: Package Windows executable
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run package:windows
      - name: Launch the packaged executable
        shell: pwsh
        run: |
          $exe = Resolve-Path dist/AI-Debate-windows-x64.exe
          & $exe --version
          & $exe --help
      - name: Run the acceptance against the packaged executable
        shell: bash
        env:
          AI_DEBATE_BIN: dist/AI-Debate-windows-x64.exe
        run: node --experimental-transform-types test/acceptance/standalone.ts
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist/AI-Debate-windows-x64.exe
            dist/AI-Debate-windows-x64.exe.sha256
            dist/AI-Debate-windows-x64.sha256.txt
          if-no-files-found: error

  package-linux:
    name: Package Linux archive
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run package:linux
      - name: Verify the systemd unit renders and parses
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          sed "s|@PREFIX@|/opt/ai-debate|g; s|@DATA_DIR@|/var/lib/ai-debate|g; s|@CONF_DIR@|/etc/ai-debate|g; s|@APP_USER@|ai-debate|g"             packaging/linux/ai-debate.service > "$tmp/ai-debate.service"
          systemd-analyze verify "$tmp/ai-debate.service" || true
          grep -q "Restart=always" "$tmp/ai-debate.service"
          grep -q "ExecStart=/opt/ai-debate/bin/ai-debate serve" "$tmp/ai-debate.service"
      - name: Boot a real systemd inside a container
        run: |
          set -euo pipefail
          # The ubuntu-22.04 runner has no systemd as PID 1, so a unit file cannot be
          # "verified" by starting it. A privileged container running systemd is the
          # smallest environment where install.sh, systemctl enable --now, a kill -9
          # restart and a reinstall can all be exercised for real.
          docker rm -f ai-debate-sysd >/dev/null 2>&1 || true
          # The image's own documented invocation: privileged, its own cgroup
          # namespace (Docker's default on cgroup v2), and tmpfs for /run so systemd
          # can create its sockets. Mounting the host cgroup tree read-write is what
          # made the container die instantly on the previous attempt.
          docker run -d --privileged --network host --name ai-debate-sysd \
            --tmpfs /run --tmpfs /run/lock --tmpfs /tmp \
            jrei/systemd-ubuntu:22.04 /sbin/init
          started=0
          for _ in $(seq 1 90); do
            # `is-system-running` exits non-zero for `degraded`, which is the normal
            # state of a container image with a few unneeded units failing. The
            # private socket is the honest "PID 1 is systemd and listening" signal.
            if docker exec ai-debate-sysd test -S /run/systemd/private 2>/dev/null; then started=1; break; fi
            if [[ "$(docker inspect -f '{{.State.Running}}' ai-debate-sysd 2>/dev/null)" != "true" ]]; then break; fi
            sleep 1
          done
          if [[ "${started}" -ne 1 ]]; then
            echo '::error::容器里的 systemd 没有起来'
            docker logs ai-debate-sysd 2>&1 | tail -40 || true
            exit 1
          fi
          docker exec ai-debate-sysd bash -lc 'systemctl is-system-running || true; systemctl --version | head -1'
      - name: Start a model stub on the host
        run: |
          set -euo pipefail
          node test/support/mock-model.mjs &
          sleep 1
      - name: Install, enable, kill and reinstall under systemd
        run: |
          set -euo pipefail
          docker exec ai-debate-sysd bash -lc 'apt-get update -qq && apt-get install -y -qq curl >/dev/null'
          docker cp dist/ai-debate-linux-x64.tgz ai-debate-sysd:/tmp/ai-debate.tgz
          docker cp test/acceptance/linux-install.sh ai-debate-sysd:/tmp/linux-install.sh
          docker exec -e AI_DEBATE_MOCK_URL=http://127.0.0.1:17863 ai-debate-sysd bash /tmp/linux-install.sh /tmp/ai-debate.tgz
      - name: Show the systemd journal if it failed
        if: failure()
        run: |
          docker exec ai-debate-sysd journalctl -u ai-debate -n 120 --no-pager || true
          docker logs ai-debate-sysd 2>&1 | tail -60 || true
      - name: Stop the container
        if: always()
        run: docker rm -f ai-debate-sysd || true
      - uses: actions/upload-artifact@v4
        with:
          name: linux-tgz
          path: |
            dist/ai-debate-linux-x64.tgz
            dist/ai-debate-linux-x64.tgz.sha256
          if-no-files-found: error

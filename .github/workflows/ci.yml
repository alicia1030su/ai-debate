name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22.18.0'

jobs:
  secrets-scan:
    name: Credential and privacy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Scan tracked files for credentials
        run: node scripts/scan-secrets.mjs

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        # Builds core first: the monitoring acceptance imports the compiled surface
        # (lib/) deliberately, the same way the migrated core tests do.
        run: npm run typecheck
      - name: Build core, web and server bundle
        run: npm run build && npm run bundle
      - name: Core tests
        shell: bash
        run: npm run test:core
      - name: Server tests
        shell: bash
        run: node --experimental-transform-types --test --test-concurrency=2 "packages/server/test/**/*.test.ts"
      - name: Web tests
        shell: bash
        run: node --test packages/web/test/*.test.mjs
      - name: Secret scanner regression tests
        shell: bash
        run: npm run test:secrets
      - name: End-to-end acceptance
        shell: bash
        run: node --experimental-transform-types test/acceptance/standalone.ts
      - name: Background monitoring acceptance
        shell: bash
        run: node --experimental-transform-types test/acceptance/automation.ts
      - name: Crash recovery acceptance
        shell: bash
        run: node --experimental-transform-types test/acceptance/recovery.ts
      - name: Paging and cursor acceptance
        shell: bash
        run: node --experimental-transform-types test/acceptance/paging.ts
      - name: Upgrade fixtures (v0.2.1 shape and v0.2.0 compatibility)
        shell: bash
        run: node --experimental-transform-types test/acceptance/upgrade.ts
      - name: No DSH dependency
        shell: bash
        run: node scripts/assert-no-dsh.mjs

  # The fixture job proves deterministic edge cases; this job proves the actual
  # bytes shipped in both releases. v0.2.1 is the primary upgrade target and
  # v0.2.0 remains a real-binary compatibility regression in the same script.
  upgrade-real:
    name: Upgrade from real v0.2.1 (v0.2.0 compatibility)
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build && npm run bundle
      - name: Download and verify v0.2.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v0.2.1 --repo "${{ github.repository }}" \
            --pattern 'ai-debate-linux-x64.tgz' --pattern 'SHA256SUMS.txt' \
            --dir /tmp/v021 --clobber
          (cd /tmp/v021 && grep -E '  ai-debate-linux-x64\.tgz$' SHA256SUMS.txt | sha256sum -c -)
          mkdir -p /tmp/v021/pkg
          tar -xzf /tmp/v021/ai-debate-linux-x64.tgz -C /tmp/v021/pkg
          V021_BIN=$(find /tmp/v021/pkg -path '*/bin/ai-debate' -type f -print -quit)
          test -n "$V021_BIN"
          chmod +x "$V021_BIN"
          "$V021_BIN" --version
          sha256sum /tmp/v021/ai-debate-linux-x64.tgz "$V021_BIN"
          echo "V021_BIN=$V021_BIN" >> "$GITHUB_ENV"
      - name: Download and verify v0.2.0 compatibility binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v0.2.0 --repo "${{ github.repository }}" \
            --pattern 'ai-debate-linux-x64.tgz' --pattern 'SHA256SUMS.txt' \
            --dir /tmp/v020 --clobber
          (cd /tmp/v020 && grep -E '  ai-debate-linux-x64\.tgz$' SHA256SUMS.txt | sha256sum -c -)
          mkdir -p /tmp/v020/pkg
          tar -xzf /tmp/v020/ai-debate-linux-x64.tgz -C /tmp/v020/pkg
          V020_BIN=$(find /tmp/v020/pkg -path '*/bin/ai-debate' -type f -print -quit)
          test -n "$V020_BIN"
          chmod +x "$V020_BIN"
          "$V020_BIN" --version
          sha256sum /tmp/v020/ai-debate-linux-x64.tgz "$V020_BIN"
          echo "V020_BIN=$V020_BIN" >> "$GITHUB_ENV"
      - name: Run the upgrade against both real binaries
        run: |
          set -euo pipefail
          echo "Primary upgrade source: real v0.2.1 binary $V021_BIN"
          echo "Compatibility source: real v0.2.0 binary $V020_BIN"
          AI_DEBATE_V021_BIN="$V021_BIN" AI_DEBATE_V020_BIN="$V020_BIN" \
            node --experimental-transform-types test/acceptance/upgrade.ts
      - name: Upload the upgrade report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-failure
          path: /tmp/ai-debate-upgrade-*/**

  soak:
    name: Soak (short, CI)
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run the pipeline for five minutes and bound the growth
        run: node --experimental-transform-types test/stress/soak.ts --seconds=300 --interval-ms=40

  package-windows:
    name: Package Windows executable
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run package:windows
      - name: Capture the Node runtime used by the SEA build
        run: node -e "require('node:fs').copyFileSync(process.execPath, 'dist/node-baseline.bin')"
      - name: Verify the release artefact and documents
        run: node scripts/verify-release.mjs
      - name: Scan the executable for embedded credentials
        run: node scripts/scan-secrets.mjs --baseline dist/node-baseline.bin dist/AI-Debate-windows-x64.exe
      - name: Launch the packaged executable
        shell: pwsh
        run: |
          $exe = Resolve-Path dist/AI-Debate-windows-x64.exe
          & $exe --version
          & $exe --help
      - name: Run the acceptance against the packaged executable
        shell: bash
        env:
          AI_DEBATE_BIN: dist/AI-Debate-windows-x64.exe
        run: node --experimental-transform-types test/acceptance/standalone.ts
      - name: Run the launcher acceptance against the packaged executable
        shell: bash
        env:
          AI_DEBATE_BIN: dist/AI-Debate-windows-x64.exe
        run: node --experimental-transform-types --test test/acceptance/windows-launcher.ts
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist/AI-Debate-windows-x64.exe
            dist/AI-Debate-windows-x64.exe.sha256
            dist/AI-Debate-windows-x64.sha256.txt
          if-no-files-found: error

  package-linux:
    name: Package and install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Check Linux deployment path policy without root
        run: bash test/acceptance/linux-path-policy.sh
      - run: npm run package:linux
      - name: Capture the Node runtime used by the SEA build
        run: node -e "require('node:fs').copyFileSync(process.execPath, 'dist/node-baseline.bin')"
      - name: Verify the release artefact and documents
        run: node scripts/verify-release.mjs
      - name: Verify and scan the packaged Linux archive
        run: |
          set -euo pipefail
          unpack=$(mktemp -d)
          trap 'rm -rf "$unpack"' EXIT
          tar -xzf dist/ai-debate-linux-x64.tgz -C "$unpack"
          binary="$unpack/ai-debate-linux-x64/bin/ai-debate"
          test -x "$binary"
          expected_version=$(node -p "require('./package.json').version")
          version_output=$(env -u AI_DEBATE_VERSION "$binary" --version 2>&1)
          printf 'packaged --version: %s\n' "$version_output"
          if ! grep -Eq "(^|[^0-9])${expected_version//./\\.}([^0-9]|$)" <<< "$version_output"; then
            echo "::error::Linux TGZ 的 bin/ai-debate 未报告 $expected_version"
            exit 1
          fi
          node scripts/scan-secrets.mjs "$unpack"
          node scripts/scan-secrets.mjs --baseline dist/node-baseline.bin "$binary"
      - name: Upload Linux diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-debug-${{ matrix.os }}
          path: |
            dist/ai-debate-linux-x64.tgz
            dist/ai-debate-linux-x64.tgz.sha256
            dist/node-baseline.bin
          if-no-files-found: ignore
          retention-days: 3
      - name: Check the systemd unit rendering and restart policy
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          sed "s|@PREFIX@|/opt/ai-debate|g; s|@DATA_DIR@|/var/lib/ai-debate|g; s|@CONF_DIR@|/etc/ai-debate|g; s|@APP_USER@|ai-debate|g" \
            packaging/linux/ai-debate.service > "$tmp/ai-debate.service"
          grep -q '^Restart=on-failure$' "$tmp/ai-debate.service"
          grep -q '^SuccessExitStatus=75$' "$tmp/ai-debate.service"
          grep -q '^RestartForceExitStatus=75$' "$tmp/ai-debate.service"
          grep -q '^StartLimitIntervalSec=60$' "$tmp/ai-debate.service"
          grep -q '^StartLimitBurst=10$' "$tmp/ai-debate.service"
          grep -q '^ReadWritePaths=/var/lib/ai-debate$' "$tmp/ai-debate.service"
          grep -q '^ProtectSystem=strict$' "$tmp/ai-debate.service"
          grep -q '^ExecStart=/opt/ai-debate/bin/ai-debate serve$' "$tmp/ai-debate.service"
          if grep -q '@[A-Z_]*@' "$tmp/ai-debate.service"; then
            echo "unit 仍有未渲染占位符" >&2
            exit 1
          fi
          # A verifier failure must fail the job. The valid rendered unit is
          # verified by linux-install.sh after the real binary/user exist.
          printf '\nType=definitely-invalid-service-type\n' >> "$tmp/ai-debate.service"
          if systemd-analyze verify "$tmp/ai-debate.service"; then
            echo "systemd-analyze 错误地接受了非法 unit" >&2
            exit 1
          fi
      - name: Prove this runner has a working systemd
        run: |
          set -euo pipefail
          # The runner's PID 1 is systemd, but it reports `starting` for a while after
          # boot and never reaches `running` on these images. The honest test is not
          # the reported state — it is whether a unit can actually be started.
          ps -p 1 -o comm= | grep -qx systemd
          sudo systemctl start cron
          test "$(systemctl is-active cron)" = "active"
          systemctl --version | head -1
      - name: Install the archive and run the full lifecycle on real systemd
        run: |
          set -euo pipefail
          sudo bash test/acceptance/linux-install.sh dist/ai-debate-linux-x64.tgz
      - name: Show the systemd journal if it failed
        if: failure()
        run: |
          systemctl --no-pager --full status ai-debate || true
          journalctl -u ai-debate -n 150 --no-pager || true
      - name: Remove the service after the run
        if: always()
        run: |
          sudo systemctl disable --now ai-debate 2>/dev/null || true
          sudo rm -f /etc/systemd/system/ai-debate.service /etc/logrotate.d/ai-debate
          sudo systemctl daemon-reload || true
      - if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: linux-tgz
          path: |
            dist/ai-debate-linux-x64.tgz
            dist/ai-debate-linux-x64.tgz.sha256
          if-no-files-found: error

  # Debian 12 has no hosted runner. This job proves the archive installs and the
  # binary runs on Debian 12's glibc, and explicitly does *not* claim systemd
  # lifecycle coverage there: a container has no init. The job prints that limit so
  # a green tick cannot be mistaken for a systemd verification.
  debian12:
    name: Debian 12 binary compatibility (no systemd)
    runs-on: ubuntu-22.04
    needs: package-linux
    container: debian:12
    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites
        run: |
          apt-get update -qq
          apt-get install -y -qq curl ca-certificates tar >/dev/null
      - name: Download the archive built by this run
        uses: actions/download-artifact@v4
        with:
          name: linux-tgz
          path: /tmp/ai-debate
      - name: Install without systemd and run the service
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice::Debian 12 容器没有 init，本作业只验证安装与程序兼容性，不验证 systemd 生命周期"
          tar -xzf /tmp/ai-debate/ai-debate-linux-x64.tgz -C /tmp
          cd /tmp/ai-debate-linux-x64
          ./install.sh --host 127.0.0.1 --port 17871 --no-start
          /opt/ai-debate/bin/ai-debate --version
          AI_DEBATE_HOME=/var/lib/ai-debate /opt/ai-debate/bin/ai-debate serve --port 17871 &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:17871/healthz >/dev/null 2>&1; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:17871/healthz
          curl -fsS -o /dev/null -w 'index:%{http_code}\n' http://127.0.0.1:17871/
          curl -fsS -o /dev/null -w 'auth:%{http_code}\n' http://127.0.0.1:17871/api/ai-debate/auth/state

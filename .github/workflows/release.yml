name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.2.1)'
        required: true

permissions:
  contents: write

env:
  NODE_VERSION: '22.18.0'

jobs:
  guard:
    name: Refuse to overwrite a published release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the release does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          echo "tag=$TAG"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Published tags and assets are immutable."
            exit 1
          fi
      - name: Check the tag's version matches the source
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').version")
          # A tag that disagrees with package.json produces artefacts whose reported
          # version is not the one on the download page — the exact mismatch that
          # makes "which build is this?" unanswerable later.
          if [ "v$PKG" != "$TAG" ]; then
            echo "::error::package.json says $PKG but the tag is $TAG"
            exit 1
          fi
          echo "package.json 与标签一致：$TAG"
      - name: Check the release notes exist
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          test -f "docs/release-notes-${TAG}.md" || {
            echo "::error::缺少 docs/release-notes-${TAG}.md"
            exit 1
          }

  verify:
    name: Verify before release
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: node scripts/scan-secrets.mjs
      - run: npm run typecheck
      - run: npm run build && npm run bundle
      - run: npm run test:core
      - run: node --experimental-transform-types --test --test-concurrency=2 "packages/server/test/**/*.test.ts"
      - run: node --test packages/web/test/*.test.mjs
      - run: node --experimental-transform-types test/acceptance/standalone.ts
      - run: node --experimental-transform-types test/acceptance/automation.ts
      - run: node --experimental-transform-types test/acceptance/recovery.ts
      - run: node --experimental-transform-types test/acceptance/paging.ts
      - run: node --experimental-transform-types test/acceptance/upgrade.ts
      - run: node scripts/assert-no-dsh.mjs
      - name: Soak the pipeline for five minutes
        run: node --experimental-transform-types test/stress/soak.ts --seconds=300 --interval-ms=40

  windows:
    name: Build Windows executable
    runs-on: windows-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run package:windows
      - shell: pwsh
        run: |
          & dist/AI-Debate-windows-x64.exe --version
          & dist/AI-Debate-windows-x64.exe --help
      - name: Prove the packaged executable completes the workflow
        shell: bash
        env:
          AI_DEBATE_BIN: dist/AI-Debate-windows-x64.exe
        run: node --experimental-transform-types test/acceptance/standalone.ts
      - name: Prove the launcher behaves
        shell: bash
        env:
          AI_DEBATE_BIN: dist/AI-Debate-windows-x64.exe
        run: node --experimental-transform-types --test test/acceptance/windows-launcher.ts
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/AI-Debate-windows-x64.exe
            dist/AI-Debate-windows-x64.exe.sha256
          if-no-files-found: error

  linux:
    name: Build Linux archive
    runs-on: ubuntu-22.04
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run package:linux
      - name: Prove this runner has a working systemd
        run: |
          set -euo pipefail
          ps -p 1 -o comm= | grep -qx systemd
          sudo systemctl start cron
          test "$(systemctl is-active cron)" = "active"
      - name: Prove the archive installs, survives a kill and keeps data
        run: sudo bash test/acceptance/linux-install.sh dist/ai-debate-linux-x64.tgz
      - name: Show the systemd journal if it failed
        if: failure()
        run: |
          systemctl --no-pager --full status ai-debate || true
          journalctl -u ai-debate -n 150 --no-pager || true
      - name: Remove the service after the run
        if: always()
        run: |
          sudo systemctl disable --now ai-debate 2>/dev/null || true
          sudo rm -f /etc/systemd/system/ai-debate.service /etc/logrotate.d/ai-debate
          sudo systemctl daemon-reload || true
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/ai-debate-linux-x64.tgz
            dist/ai-debate-linux-x64.tgz.sha256
          if-no-files-found: error

  publish:
    name: Publish the release
    runs-on: ubuntu-latest
    needs: [guard, windows, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets and checksums
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.exe' -o -name '*.tgz' \) -exec cp {} release/ \;
          cd release
          sha256sum *.exe *.tgz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Scan the archives before publishing them
        run: |
          set -euo pipefail
          # The repository scan covers tracked files; an archive can still carry
          # something that was never committed. Unpack, scan, and fail the release.
          mkdir -p /tmp/unpack
          tar -xzf release/ai-debate-linux-x64.tgz -C /tmp/unpack
          node scripts/scan-secrets.mjs /tmp/unpack
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # `prerelease=false` is explicit: this workflow publishes production
          # releases only, and an RC must never be produced by it.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "AI Debate $TAG" \
            --notes-file "docs/release-notes-${TAG}.md" \
            --prerelease=false \
            release/AI-Debate-windows-x64.exe \
            release/ai-debate-linux-x64.tgz \
            release/SHA256SUMS.txt

  verify-assets:
    name: Download the published assets and re-check them
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download what was published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p downloaded
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir downloaded --clobber
          cd downloaded
          sha256sum -c SHA256SUMS.txt
          echo "--- 已发布资产 ---"
          ls -la
      - name: Check the published checksums match the release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.name) \(.digest)"'
      - name: Unpack and scan the published Linux archive
        run: |
          set -euo pipefail
          mkdir -p /tmp/published
          tar -xzf downloaded/ai-debate-linux-x64.tgz -C /tmp/published
          node scripts/scan-secrets.mjs /tmp/published
      - name: Confirm the release is the latest and not a prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # `gh release view --json` has no `isLatest` field, so asking for it fails
          # the step with "Unknown JSON field" — which is how the first v0.2.1 run
          # went red *after* a successful publish. The answer comes from the
          # `/releases/latest` endpoint instead.
          IS_PRE=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')
          LATEST=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
          echo "prerelease=$IS_PRE latest=$LATEST tag=$TAG"
          if [ "$IS_PRE" != "false" ]; then
            echo "::error::这是一个预发布版本，正式发行不允许"
            exit 1
          fi
          if [ "$LATEST" != "$TAG" ]; then
            echo "::error::$TAG 不是 Latest（当前是 $LATEST）"
            exit 1
          fi
